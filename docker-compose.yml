version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: loanlens_database
    restart: unless-stopped
    environment:
      POSTGRES_DB: loanlens
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: loanlens_redis_setup
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
